spring.application.name=securebank-api
server.port=8080

# H2 in-memory database (data resets on every restart) - good enough for a demo bank backend.
# Swap these 4 lines for a real MySQL/Postgres connection when you're ready for persistence.
spring.datasource.url=jdbc:h2:mem:securebank;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console at http://localhost:8080/h2-console (jdbc url above, user sa, blank password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT - CHANGE THIS SECRET before deploying anywhere real
app.jwt.secret=c2VjdXJlYmFua19kZW1vX3NlY3JldF9rZXlfY2hhbmdlX21lX2luX3Byb2R1Y3Rpb25fcGxlYXNlXzEyMzQ1Ng==
app.jwt.expiration-ms=3600000

# Allowed origin for the static frontend (Live Server / file server). Adjust as needed.
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:5501
